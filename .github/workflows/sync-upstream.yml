name: Sync upstream

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # npm ci and upstream's tests run before the push; keep the write
          # token out of .git/config where an install script could read it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Merge upstream/main
        run: |
          git config user.name "Ashutosh Sharma"
          git config user.email "ashutoshsharmawhy@gmail.com"
          scripts/sync-upstream.sh

      # GITHUB_TOKEN cannot push changes to .github/workflows, so an upstream
      # commit that touches a workflow fails here. Sync by hand in that case.
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:main
